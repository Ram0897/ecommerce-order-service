spring:
  application:
    name: ecommerce-order-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ecommerce}
    username: ${DB_USERNAME:ecommerce}
    password: ${DB_PASSWORD:ecommerce}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: ${PORT:8080}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
app:
  security:
    jwt-secret: ${JWT_SECRET:change-this-development-secret-to-at-least-32-characters}
    username: ${APP_USERNAME:admin}
    password: ${APP_PASSWORD:change-me}
